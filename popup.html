<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; width: 360px; margin: 0; padding: 12px; font-size: 13px; color: #222; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    .step { margin: 8px 0; }
    .step b { display: inline-block; min-width: 42px; color: #555; }
    select { flex: 1; padding: 4px; min-width: 200px; }
    .row { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { margin: 6px 0; color: #0a7; font-weight: 600; }
    #result { background: #f5f5f5; padding: 8px; max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-all; border-radius: 4px; margin: 6px 0; font-size: 12px; }
    .dim { color: #888; font-size: 12px; }
    .err { color: #c00 !important; }
    .guide { background: #eef4ff; border: 1px solid #d5e2ff; border-radius: 6px; padding: 8px 10px; margin: 4px 0 10px; font-size: 12px; color: #345; }
  </style>
</head>
<body>
  <h3>爬爬蚁</h3>
  <div class="dim" style="margin:-4px 0 8px">多平台创作者数据统计</div>
  <div class="guide">使用步骤：选平台 + 选周期 → 点「提取数据」→ 点「下载」按钮保存。</div>
  <div class="step"><b>平台</b><select id="platform">
    <option value="抖音">抖音</option>
    <option value="视频号">视频号</option>
    <option value="小红书" disabled>小红书（暂未接入）</option>
    <option value="哔哩哔哩">哔哩哔哩</option>
  </select></div>
  <div class="step"><b>周期</b><select id="period">
    <option value="month">上一个月（自然月）</option>
    <option value="week">上一周（自然周）</option>
  </select></div>
  <div class="row"><button id="extract">提取数据</button></div>
  <div class="row">
    <button id="csv" disabled>下载汇总</button>
    <button id="postCsv" disabled>下载单篇</button>
    <button id="zipCover" disabled>下载封面</button>
  </div>
  <div id="status"></div>
  <div id="result"></div>
  <div class="row"><button id="biliSample">导出9月29日分析样本</button></div>
  <div class="dim">需先在已登录的平台页面使用。B站作品明细为所选周期发布作品的累计数据。小红书暂未接入。</div>
  <div class="dim">遇到问题或想改进？加 QQ 交流群：1107628766</div>
  <script src="popup.js"></script>
  <script src="popup-sample.js"></script>
</body>
</html>
