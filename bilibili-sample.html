<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>9月29日作品分析样本 · 爬爬蚁</title>
  <style>
    body { font: 15px/1.7 system-ui, "Microsoft YaHei", sans-serif; max-width: 760px; margin: 48px auto; padding: 0 24px; color: #222; background: #f7f8fa; }
    main { background: white; padding: 28px; border-radius: 12px; }
    h1 { font-size: 23px; margin-top: 0; }
    button { padding: 10px 18px; margin-right: 10px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { margin: 20px 0; font-weight: 600; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body><main>
  <h1>9月29日作品分析样本</h1>
  <p>自动查找 2026 年 9 月 29 日发布的作品，采集留存、点击率候选值、播放趋势、同类基准和平均实际播放时长。请保持已登录的 B 站页面打开。</p>
  <button id="collect">采集并下载样本</button><button id="download" disabled>下载已采集样本</button>
  <div id="status" role="status" aria-live="polite">准备采集…</div>
  <div id="result"></div>
  <p>完成后，把下载的 JSON 文件发回当前对话，即可核对真实数值和缺失字段。</p>
</main><script src="bilibili-sample-page.js"></script></body>
</html>
